version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    groups:
      # Every version update, majors included, in one PR; CI runs the actions it bumps.
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    ignore:
      # Runtime majors without a security fix stay off (operator, 2026-10-24); react and react-dom 19.3.1 came as #28.
      # update-types limits this to version updates; security updates still open.
      - dependency-name: "react"
        update-types:
          - version-update:semver-major
      - dependency-name: "react-dom"
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: deno
    directories:
      - /supabase/functions/cleanup-expired-photos
      - /supabase/functions/close-opportunity
      - /supabase/functions/create-photo-upload
      - /supabase/functions/create-photo-view
      - /supabase/functions/get-attendance
      - /supabase/functions/get-public-opportunity
      - /supabase/functions/manage-applicant-privacy
      - /supabase/functions/publish-opportunity
      - /supabase/functions/record-attendance
      - /supabase/functions/resolve-application
      - /supabase/functions/select-application
      - /supabase/functions/send-attendance-reminders
      - /supabase/functions/submit-application
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    groups:
      deno-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      deno-security:
        applies-to: security-updates
        patterns:
          - "*"
