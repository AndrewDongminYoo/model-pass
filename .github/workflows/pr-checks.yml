name: PR checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 11.24.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
          cache: true
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Test Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for test_file in supabase/functions/*/index.test.ts; do
            function_dir="${test_file%/index.test.ts}"
            deno test -A --sloppy-imports --frozen-lockfile \
              --config "$function_dir/deno.json" \
              --lock "$function_dir/deno.lock" \
              "$test_file"
          done
      - run: supabase start
      - run: supabase test db
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Test Apps in Toss link entry
        run: MODEL_PASS_E2E_SURFACE=ait pnpm exec playwright test e2e/ait-link-entry.spec.ts
